name: Debug CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:    
      - 'src/**'
      - 'tests/**'

jobs:
  MacBuild:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-13, macos-14]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install meson==1.6 ninja gcovr

      - name: Configure Project
        run: meson setup builddir/

      - name: Compile Debug Version
        run: meson compile -C builddir/ -v cDebug tDebug gDebug

      - name: Run Tests
        run: meson test 'Soldmania:' -C builddir/ --print-errorlogs 
           
      - name: Generating Coverage Report 
        run: ninja coverage-html -C builddir/
        
      - name: Upload Test Log
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}_Logs
          path: |
            ./builddir/meson-logs/**/*
            ./builddir/cDebug 
            ./builddir/tDebug 
            ./builddir/gDebug
          if-no-files-found: error # optional, default is warn  
          retention-days: 7 # optional
          include-hidden-files: false # optional, default is false

  LinuxBuild:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install meson==1.6 ninja gcovr
          sudo apt update && sudo apt install gcc

      - name: Configure Project
        run: meson setup builddir/

      - name: Compile Debug Version
        run: meson compile -C builddir/ -v cDebug tDebug gDebug

      - name: Run Tests
        run:  meson test 'Soldmania:' -C builddir/ --print-errorlogs 
           
      - name: Generating Coverage Report 
        run: ninja coverage-html -C builddir/
        
      - name: Upload Test Log
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}_Logs
          path: |
            ./builddir/meson-logs/**/*
            ./builddir/cDebug 
            ./builddir/tDebug 
            ./builddir/gDebug
          if-no-files-found: error # optional, default is warn  
          retention-days: 7 # optional
          include-hidden-files: false # optional, default is false

  WinBuild:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install meson==1.6 ninja gcovr 
        
      - name: Configure Project
        run: meson setup builddir/

      - name: Compile Debug Version
        run: meson compile -C builddir/ -v cDebug tDebug gDebug

      - name: Run Tests
        run:  meson test 'Soldmania:' -C builddir/ --print-errorlogs 
        
      - name: Upload Test Log
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}_Logs
          path: |
            ./builddir/meson-logs/**/*
            ./builddir/cDebug 
            ./builddir/tDebug 
            ./builddir/gDebug
          if-no-files-found: error # optional, default is warn  
          retention-days: 7 # optional
          include-hidden-files: false # optional, default is false
  
  Formating:
    name: Formating and Linting Code Base
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: sudo apt update && sudo apt install clang-format 

      - name: Formatting Codebase
        run: clang-format src/**/* --verbose -i

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '(CI-Pipline): Formating Codebase' 
